<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1f4fb8" />
  <title>Wedding Hall Owner Tycoon</title>
  <link rel="icon" href="icon.svg" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <div id="boot" style="position:fixed;inset:0;display:flex;flex-direction:column;gap:22px;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#4f86ee,#12307a);color:#fff;font:800 17px sans-serif;text-align:center;padding:24px;z-index:200">
    <img src="logo-en.svg" id="boot-logo" alt="" style="width:min(380px,82vw);filter:drop-shadow(0 10px 16px rgba(0,0,0,.4))" />
    <div style="width:min(300px,70vw);height:12px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden"><i id="boot-bar" style="display:block;height:100%;width:8%;background:linear-gradient(#fff2b0,#e2b84f);border-radius:6px;transition:width .4s"></i></div>
    <div id="boot-tip" style="max-width:420px;line-height:1.45;opacity:.95"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
