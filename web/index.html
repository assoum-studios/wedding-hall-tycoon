<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f7d6e0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Wedding Hall Tycoon" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="brand/apple-touch-icon.png" />
  <title>Wedding Hall Tycoon</title>
  <link rel="icon" href="brand/icon-192.png" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <div id="boot" style="position:fixed;inset:0;display:flex;flex-direction:column;gap:22px;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#fff7f0,#fbd3e0 55%,#e9b8d0);color:#5a2a48;font:800 17px sans-serif;text-align:center;padding:24px;z-index:200">
    <img src="brand/game-logo.webp" id="boot-logo" alt="Wedding Hall Tycoon" style="width:min(340px,76vw,42vh);filter:drop-shadow(0 10px 16px rgba(90,30,70,.3))" />
    <div style="width:min(300px,70vw);height:12px;border-radius:6px;background:rgba(120,40,90,.15);overflow:hidden"><i id="boot-bar" style="display:block;height:100%;width:8%;background:linear-gradient(#fff2b0,#e2b84f);border-radius:6px;transition:width .4s"></i></div>
    <div id="boot-tip" style="max-width:420px;line-height:1.45;opacity:.95"></div>
  </div>
  <!-- Soft studio intro: Assoum Studios fades in and out (pure CSS so it stays smooth while the game loads), then the game logo on the loading screen -->
  <style>
    #intro { position: fixed; inset: 0; z-index: 300; background: #ffffff; display: flex; align-items: center; justify-content: center; pointer-events: none; animation: introOut .8s ease 2.6s forwards; }
    #intro img { width: min(300px, 62vw); opacity: 0; animation: introLogo 2.5s ease .2s forwards; }
    @keyframes introLogo { 0% { opacity: 0; transform: scale(.94); } 30% { opacity: 1; } 75% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.01); } }
    @keyframes introOut { to { opacity: 0; visibility: hidden; } }
    #boot img { animation: bootLogo .9s ease 2.7s both; }
    @keyframes bootLogo { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
  </style>
  <div id="intro"><img src="brand/assoum-studios.webp" alt="Assoum Studios" /></div>
  <script>
    (function () {
      var intro = document.getElementById('intro');
      if (location.search.indexOf('fast') >= 0) { intro.remove(); return; }
      setTimeout(function () { intro.remove(); }, 3500);
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
