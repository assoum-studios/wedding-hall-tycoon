name: Build signed Android App Bundle (.aab)

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install game dependencies
        working-directory: web
        run: npm ci

      - name: Tests (types, English/Arabic tables, 30-day playthrough on every difficulty, save/reload)
        working-directory: web
        run: npm test

      - name: Build the game
        working-directory: web
        run: npm run build

      - name: Copy the game into the Android app
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets
          cp -r web/dist android/app/src/main/assets/www

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (preinstalled on GitHub runners)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare the upload key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Your private Play upload key, stored as encrypted GitHub secrets.
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/upload.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            # No secrets yet: sign with a throwaway key so the bundle can still be tested.
            # This key is never saved or published (the repository is public). Do not upload this build to Play.
            PASS=$(openssl rand -hex 16)
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$RUNNER_TEMP/keys/upload.jks" -storetype JKS -alias throwaway -keyalg RSA -keysize 2048 -validity 30 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Throwaway test key" > /dev/null
            echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=throwaway" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "suffix=-TEST-KEY-not-for-Play" >> "$GITHUB_OUTPUT"
            echo "::warning::Signed with a throwaway key. Add the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets to sign with your Play upload key."
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/keys/upload.jks" >> "$GITHUB_ENV"

      - name: Build the signed release bundle
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle --no-daemon bundleRelease

      - name: Verify the signature
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" | tail -1
          mkdir -p out
          cp "$AAB" "out/WeddingHallOwnerTycoon-1.0.${{ github.run_number }}${{ steps.key.outputs.suffix }}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: WeddingHallOwnerTycoon-aab
          path: out/*.aab

      - name: Publish the web build (for testing in a browser)
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/dist
